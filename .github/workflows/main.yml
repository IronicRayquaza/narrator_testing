name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - run: npm install
    - run: npm test
    - name: Deploy to Production
      run: |
        echo "Starting deployment..."
        echo "Error: SSL Certificate expired on production server"
        exit 1
